name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Format Check
        run: cargo fmt --all --check
      
      - name: Lint Check
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Build
        run: cargo build --release
      
      - name: Test
        run: cargo test --all
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-init-cli-${{ runner.os }}
          path: ${{ matrix.os == 'windows-latest' && './target/release/github-init-cli.exe' || './target/release/github-init-cli' }}
          retention-days: 1
  
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List Artifacts
        run: ls -la ./artifacts
      
      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release v${{ github.ref_name }}" \
            --notes "Release v${{ github.ref_name }}" \
            --prerelease=false \
            artifacts/github-init-cli-Linux/github-init-cli \
            artifacts/github-init-cli-Windows/github-init-cli.exe \
            artifacts/github-init-cli-macOS/github-init-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}